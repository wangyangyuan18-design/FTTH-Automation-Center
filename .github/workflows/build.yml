name: Build Portable Desktop
on:
  workflow_dispatch:
  push:
    branches: [main, desktop-ui-control-prototype]
    paths:
      - "desktop/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build onedir package
        run: pyinstaller --noconfirm --clean --windowed --name FTTH_Automation --collect-all pywinauto --collect-all comtypes --collect-all pyautogui desktop/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FTTH_Automation-Windows-Portable
          path: dist/FTTH_Automation/
